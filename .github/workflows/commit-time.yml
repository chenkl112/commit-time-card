name: Update commit time card

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-time-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_commit_time.py
      - name: Update pinned Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/update_gist.py --gist-id 39364fb77de56eae9873d4ed1bea0059
      - name: Publish card
        run: |
          if git diff --quiet -- assets/commit-time.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/commit-time.svg
          git commit -m 'docs(profile): 更新提交时间统计'
          git pull --rebase origin main
          git push origin HEAD:main
